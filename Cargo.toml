[package]
name = "lite-monitor"
version = "0.1.0"
edition = "2021"
description = "轻量级 Windows 硬件监控条（Rust + egui）"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
nvml-wrapper = "0.10"
